# Windows build. A pushed tag v* builds the zip and publishes it as that
# tag's release; a manual run only keeps the zip as a short-lived artifact.
name: Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the pinned dependencies
        run: python -m pip install --no-deps -r packaging/requirements-lock.txt
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FunPairDL-windows
          path: dist/*.zip
          retention-days: 3
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" (Get-Item dist/*.zip).FullName --title "FunPairDL $env:GITHUB_REF_NAME" --generate-notes
